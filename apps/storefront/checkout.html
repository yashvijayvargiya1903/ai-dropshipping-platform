<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DROP — Checkout</title><link rel="stylesheet" href="./styles.css"></head><body><header class="nav"><a class="logo" href="./index.html">DROP<span>.</span></a><span>Secure checkout</span></header><main class="checkout"><section><p class="eyebrow">DELIVERY DETAILS</p><h1>Where should we deliver?</h1><form id="form"><div class="two"><input required name="name" placeholder="Full name"><input required name="mobile" pattern="[0-9]{10}" placeholder="Mobile number"></div><input required name="address" placeholder="Complete address"><div class="three"><input required name="city" placeholder="City"><input required name="state" placeholder="State"><input required name="pincode" pattern="[0-9]{6}" placeholder="Pincode"></div><p class="eyebrow">PAYMENT</p><div class="pay"><label><input type="radio" name="payment" value="UPI" checked> UPI / GPay / PhonePe</label><label><input type="radio" name="payment" value="CARD"> Debit / Credit Card</label><label><input type="radio" name="payment" value="COD"> Cash on Delivery</label></div><button class="primary" type="submit">Place demo order</button></form><div id="done"></div></section><aside class="summary"><p class="eyebrow">ORDER SUMMARY</p><div id="items"></div><hr><strong id="total"></strong></aside></main><script src="./checkout.js"></script></body></html>
