<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Trendskartco — Account</title><link rel="stylesheet" href="./styles.css"></head><body><header class="nav"><a class="logo brand-lockup" href="./index.html"><span class="brand-mark">⌂</span><span class="brand-script">Trendskartco<span>.in</span></span></a><span>Account</span></header><main class="auth"><section><p class="eyebrow">YOUR ACCOUNT</p><h1>Welcome to Trendskartco.</h1><p>Sign in to view orders and manage your account.</p><div style="margin:20px 0;padding:16px;border:1px solid #b7d9c2;background:#f0faf3;border-radius:12px"><h2 style="margin:0 0 8px;font-size:18px">Explore the demo</h2><p style="margin:0 0 12px">Open the owner dashboard without entering an email, password or name.</p><a href="https://yashvijayvargiya1903.github.io/ai-dropshipping-platform/admin/" style="display:block;text-align:center;padding:13px 16px;background:#176b42;color:white;border-radius:9px;text-decoration:none;font-weight:700">Skip login · Open demo dashboard</a></div><form id="auth"><input id="email" type="email" required placeholder="Email"><input id="password" type="password" required minlength="8" placeholder="Password (8+ characters)"><input id="name" placeholder="Name (for new account)"><div class="two"><button class="primary" type="submit">Sign in</button><button class="secondary" type="button" id="signup">Create account</button></div></form><p id="msg"></p></section></main><script type="module">import {supabase} from "./supabase.js";const msg=document.querySelector("#msg"),redirect=new URLSearchParams(location.search).get("redirect");const safeRedirect=redirect&&redirect.startsWith("/")&&!redirect.startsWith("//")?redirect:"./account.html";const emailEl=document.querySelector("#email"),passwordEl=document.querySelector("#password"),nameEl=document.querySelector("#name");document.querySelector("#auth").onsubmit=async e=>{e.preventDefault();const{error}=await supabase.auth.signInWithPassword({email:emailEl.value.trim(),password:passwordEl.value});if(error){msg.textContent=error.message;return}location.href=safeRedirect};document.querySelector("#signup").onclick=async()=>{const{data,error}=await supabase.auth.signUp({email:emailEl.value.trim(),password:passwordEl.value,options:{data:{name:nameEl.value.trim()}}});if(error){msg.textContent=error.message;return}if(data.session)location.href=safeRedirect;else msg.textContent="Account created. Check your email if confirmation is enabled.";};</script></body></html>
