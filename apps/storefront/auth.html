<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trendskartco — Account</title><link rel="stylesheet" href="./styles.css"></head><body><header class="nav"><a class="logo brand-lockup" href="./index.html"><span class="brand-mark">⌂</span><span class="brand-script">Trendskartco<span>.in</span></span></a><span>Account</span></header><main class="auth"><section><p class="eyebrow">YOUR ACCOUNT</p><h1>Welcome to Trendskartco.</h1><p>Sign in to view orders and manage your account.</p><form id="auth"><input id="email" type="email" required placeholder="Email"><input id="password" type="password" required minlength="6" placeholder="Password"><input id="name" placeholder="Name (for new account)"><div class="two"><button class="primary" type="submit">Sign in</button><button class="secondary" type="button" id="signup">Create account</button></div></form><p id="msg"></p></section></main><script type="module">import {supabase} from "./supabase.js";const msg=document.querySelector("#msg");document.querySelector("#auth").onsubmit=async e=>{e.preventDefault();const email=emailEl.value,password=passwordEl.value;const{error}=await supabase.auth.signInWithPassword({email,password});msg.textContent=error?error.message:"Signed in successfully.";};const emailEl=document.querySelector("#email"),passwordEl=document.querySelector("#password"),nameEl=document.querySelector("#name");document.querySelector("#signup").onclick=async()=>{const{error}=await supabase.auth.signUp({email:emailEl.value,password:passwordEl.value,options:{data:{name:nameEl.value}}});msg.textContent=error?error.message:"Account created. Check your email if confirmation is enabled.";};</script></body></html>
