<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trendskartco — My Orders</title><link rel="stylesheet" href="./styles.css"></head><body><header class="nav"><a class="logo brand-lockup" href="./index.html"><span class="brand-mark">⌂</span><span class="brand-script">Trendskartco<span>.in</span></span></a><a href="./index.html">← Store</a></header><main class="checkout"><section><p class="eyebrow">ACCOUNT</p><h1>My orders</h1><div id="orders">Checking your account…</div></section></main><script type="module">import {supabase} from "./supabase.js";const e=document.querySelector("#orders");const {data:{user}}=await supabase.auth.getUser();if(!user){e.innerHTML='<p>Please sign in to view your orders.</p><a class="primary" href="./auth.html">Sign in</a>'}else{const r=await supabase.from("orders").select("order_number,status,total_amount,created_at").order("created_at",{ascending:false});e.innerHTML=r.error?r.error.message:(r.data||[]).map(o=>`<div class="panel" style="margin:12px 0"><b>${o.order_number}</b><p>${String(o.status).replaceAll("_"," ")} · ₹${Number(o.total_amount||0).toLocaleString("en-IN")}</p><small>${new Date(o.created_at).toLocaleString("en-IN")}</small></div>`).join("")||"No orders yet."}</script></body></html>
