<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offers & Coupons — Owner Dashboard</title><link rel="stylesheet" href="./styles.css"><style>
.offer-form{display:grid;gap:14px;max-width:720px}.offer-form label{display:grid;gap:6px;font-size:12px;font-weight:700;color:#666}.offer-form input,.offer-form select{width:100%;min-width:0;padding:11px;border:1px solid #ddd;border-radius:9px;background:#fff;font:inherit;font-size:14px;color:#171717}.offer-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.offer-form button{border:0;border-radius:9px;background:#171717;color:#fff;padding:12px;font-weight:700}.offer-list{margin-top:22px}.offer-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #eee}.offer-item>div:first-child{flex:1;min-width:0}.offer-item small{display:block;color:#888;margin-top:4px}.offer-item button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 10px}.note{font-size:12px;color:#777}.status-ok{color:#25834f}.status-error{color:#b42318}@media(max-width:700px){.offer-row{grid-template-columns:1fr}.offer-form input,.offer-form select{font-size:16px}.offer-item{align-items:flex-start}}
</style></head><body><button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open owner menu" aria-expanded="false">☰</button><div class="sidebar-overlay" id="sidebarOverlay"></div><script src="./sidebar.js"></script><main><header><div><p class="muted">MARKETING</p><h1>Offers & Coupons</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="panel"><h2>Create discount</h2><p class="note">Set a discount for the whole store, a category, or orders above a minimum value.</p><form class="offer-form" id="offerForm"><label>Coupon code<input id="code" placeholder="e.g. SAVE10 (auto-generated if blank)" maxlength="40"></label><div class="offer-row"><label>Discount type<select id="kind"><option value="percent">Percentage (%)</option><option value="fixed">Fixed amount (₹)</option></select></label><label>Discount value<input id="amount" type="number" min="0.01" step="0.01" value="10" required></label></div><div class="offer-row"><label>Applies to<select id="scope"><option value="all">Entire website</option><option value="category">Specific category</option><option value="minimum">Orders above value</option></select></label><label id="scopeLabel">Minimum order value (₹)<input id="minimum" type="number" min="0" step="1" value="0"></label></div><label id="categoryWrap" hidden>Category ID<input id="category" placeholder="Enter category ID"></label><div class="offer-row"><label>Maximum discount (₹, optional)<input id="cap" type="number" min="0" step="1" placeholder="No limit"></label><label>Expiry date (optional)<input id="expiry" type="date"></label></div><button type="submit" id="create">Create coupon</button><div id="notice" class="note" aria-live="polite"></div></form></section><section class="panel offer-list"><h2>Existing coupons</h2><div id="offers" class="note">Loading coupons…</div></section></main><script type="module">import {supabase} from "../supabase.js";import {requireOwner} from "./auth.js";if(!(await requireOwner()))throw new Error("Owner access required");const el=s=>document.querySelector(s);const notice=(s,ok=false)=>{el("#notice").textContent=s;el("#notice").className="note "+(ok?"status-ok":"status-error")};el("#scope").addEventListener("change",()=>{const v=el("#scope").value;el("#categoryWrap").hidden=v!=="category";el("#scopeLabel").hidden=v!=="minimum"});async function load(){const r=await supabase.from("coupons").select("id,code,discount_type,discount_value,scope,category_id,min_order_value,max_discount,expires_at,active").order("created_at",{ascending:false});if(r.error){el("#offers").textContent="Coupon table is not ready: "+r.error.message+" — run the SQL setup in the repository's supabase/coupons.sql file.";return}el("#offers").innerHTML=r.data.length?r.data.map(c=>'<div class="offer-item"><div><b>'+c.code+'</b><small>'+(c.discount_type==="percent"?c.discount_value+"%":"₹"+c.discount_value)+" off · "+c.scope+(c.scope==="minimum"?" · min ₹"+(c.min_order_value||0):"")+(c.expires_at?" · expires "+c.expires_at:"")+'</small><small class="'+(c.active?"status-ok":"")+'">'+(c.active?"Active":"Inactive")+'</small></div><button type="button" data-id="'+c.id+'" data-active="'+c.active+'">'+(c.active?"Disable":"Enable")+'</button><button type="button" data-copy="'+c.code+'">Copy</button></div>').join(""):"No coupons created yet."}el("#offerForm").addEventListener("submit",async e=>{e.preventDefault();const button=el("#create"),scope=el("#scope").value,amount=Number(el("#amount").value),code=(el("#code").value.trim()||("SAVE"+Math.random().toString(36).slice(2,8))).toUpperCase().replace(/[^A-Z0-9_-]/g,"");if(!code||!Number.isFinite(amount)||amount<=0||(el("#kind").value==="percent"&&amount>100)){notice("Enter a valid code and discount (percentage must be 1–100).");return}if(scope==="category"&&!el("#category").value.trim()){notice("Enter a category ID.");return}button.disabled=true;const row={code,discount_type:el("#kind").value,discount_value:amount,scope,category_id:scope==="category"?el("#category").value.trim():null,min_order_value:scope==="minimum"?Number(el("#minimum").value||0):0,max_discount:el("#cap").value?Number(el("#cap").value):null,expires_at:el("#expiry").value||null,active:true};const r=await supabase.from("coupons").insert(row);button.disabled=false;if(r.error){notice("Could not create coupon: "+r.error.message);return}notice("Coupon created. Copy the code and share it with customers.",true);el("#code").value="";await load()});el("#offers").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.copy){await navigator.clipboard?.writeText(b.dataset.copy);return}if(b.dataset.id){const r=await supabase.from("coupons").update({active:b.dataset.active!=="true"}).eq("id",b.dataset.id);if(r.error){notice(r.error.message);return}await load()}});load();</script></body></html>
