<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trendskartco — Customers</title><link rel="stylesheet" href="./styles.css"></head><body><button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open owner menu" aria-expanded="false">☰</button><div class="sidebar-overlay" id="sidebarOverlay"></div><main><header><div><p class="muted">CRM</p><h1>Customers</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="panel"><div id="customers">Loading…</div></section></main><script type="module">import {supabase} from "../storefront/supabase.js";import {requireOwner} from "./auth.js";if(!(await requireOwner()))throw new Error("Owner access required");const e=document.querySelector("#customers");const r=await supabase.from("customers").select("id,name,mobile,email,created_at,orders(id,total)").order("created_at",{ascending:false});if(r.error){e.textContent=r.error.message}else{e.innerHTML=(r.data||[]).map(c=>{const orders=c.orders||[];const spend=orders.reduce((s,o)=>s+Number(o.total||0),0);return `<div class="row"><div><b>${c.name||"Customer"}</b><small>${c.mobile||""} · ${c.email||""}</small></div><strong>₹${spend.toLocaleString("en-IN")}</strong><span>${orders.length} orders</span><small>${new Date(c.created_at).toLocaleDateString("en-IN")}</small></div>`}).join("")||"No customers yet."}</script>
