<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trendskartco — Customers</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><div><p class="muted">CRM</p><h1>Customers</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="panel"><div id="customers">Loading…</div></section></main><script type="module">import {supabase} from "../storefront/supabase.js";const e=document.querySelector("#customers");const r=await supabase.from("customers").select("id,name,mobile,email,total_orders,total_spend,created_at").order("created_at",{ascending:false});e.innerHTML=r.error?r.error.message:(r.data||[]).map(c=>`<div class="row"><div><b>${c.name||"Customer"}</b><small>${c.mobile||""} · ${c.email||""}</small></div><strong>₹${Number(c.total_spend||0).toLocaleString("en-IN")}</strong><span>${c.total_orders||0} orders</span><small>${new Date(c.created_at).toLocaleDateString("en-IN")}</small></div>`).join("")||"No customers yet.";</script></body></html>
