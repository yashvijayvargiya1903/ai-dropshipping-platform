<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DROP — Returns</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><div><p class="muted">OPERATIONS</p><h1>Returns & RTO</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="panel"><div id="returns">Loading…</div></section></main><script type="module">import {supabase} from "../storefront/supabase.js";const e=document.querySelector("#returns");const r=await supabase.from("return_requests").select("id,order_id,request_type,reason,status,created_at").order("created_at",{ascending:false});e.innerHTML=r.error?r.error.message:(r.data||[]).map(x=>`<div class="row"><div><b>${x.request_type||"Return"}</b><small>${x.reason||"No reason provided"}</small></div><strong>${x.status}</strong><span>${x.order_id}</span><small>${new Date(x.created_at).toLocaleString("en-IN")}</small></div>`).join("")||"No return requests yet.";</script></body></html>
