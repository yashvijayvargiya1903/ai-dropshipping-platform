<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trendskartco — Orders</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><div><p class="muted">OPERATIONS</p><h1>Orders</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="panel"><div id="orders"></div></section></main><script>const orders=JSON.parse(localStorage.getItem("drop-orders")||"[]");document.querySelector("#orders").innerHTML=orders.length?orders.slice().reverse().map(o=>`<div class="row"><div><b>${o.id}</b><small>${o.customer.name} · ${o.customer.mobile}</small></div><strong>₹${o.total}</strong><span>${o.status}</span><small>${new Date(o.createdAt).toLocaleString("en-IN")}</small></div>`).join(""):"<p>No orders yet. Place a test order from the storefront checkout.</p>";</script></body></html>
