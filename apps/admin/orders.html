<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trendskartco — Orders</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><div><p class="muted">OPERATIONS</p><h1>Orders</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="panel"><div id="orders">Loading…</div></section></main><script type="module">import {supabase} from "../storefront/supabase.js";import {requireOwner} from "./auth.js";if(!(await requireOwner()))throw new Error("Owner access required");const e=document.querySelector("#orders"),money=n=>"₹"+Number(n||0).toLocaleString("en-IN");async function load(){const r=await supabase.from("orders").select("id,order_number,status,payment_method,payment_status,total,created_at,customers(name,mobile,email)").order("created_at",{ascending:false});if(r.error){e.textContent=r.error.message;return}const rows=r.data||[];e.innerHTML=rows.map(o=>{const c=o.customers||{};return `<div class="row"><div><b>${o.order_number}</b><small>${c.name||"Customer"} · ${c.mobile||c.email||""}</small></div><strong>${money(o.total)}</strong><span>${String(o.status||"").replaceAll("_"," ")}</span><small>${o.payment_method||"—"} · ${o.payment_status||"—"} · ${new Date(o.created_at).toLocaleString("en-IN")}</small></div>`}).join("")||"No orders yet."}load();</script></body></html>
