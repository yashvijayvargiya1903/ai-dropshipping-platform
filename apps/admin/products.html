<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trendskartco — Products</title><link rel="stylesheet" href="./styles.css"></head><body><button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open owner menu" aria-expanded="false">☰</button><div class="sidebar-overlay" id="sidebarOverlay"></div><main><header><div><p class="muted">CATALOG</p><h1>Products</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="panel"><div class="toolbar"><input id="search" placeholder="Search products…"><button id="add">+ Add product</button></div><div id="products">Loading…</div></section></main><script type="module">import {supabase} from "../storefront/supabase.js";import {requireOwner} from "./auth.js";if(!(await requireOwner()))throw new Error("Owner access required");let products=[];const el=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){const r=await supabase.from("products").select("id,name,supplier_cost,auto_margin,selling_price,active,inventory_qty,sku,category:categories(name)").order("created_at",{ascending:false});if(r.error){el("#products").textContent=r.error.message;return}products=r.data||[];render()}function render(){const q=el("#search").value.toLowerCase();el("#products").innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<div class="row"><div><b>${esc(p.name)}</b><small>${esc(p.category?.name||"Uncategorized")} · SKU ${esc(p.sku||"—")} · Cost ₹${p.supplier_cost} · Auto margin ₹${p.auto_margin}</small></div><input aria-label="Selling price" value="${p.selling_price}" onchange="window.price('${p.id}',this.value)"><input aria-label="Inventory" value="${p.inventory_qty}" onchange="window.stock('${p.id}',this.value)"><span>${p.active?"Active":"Inactive"}</span><button onclick="window.toggle('${p.id}',${p.active})">${p.active?"Disable":"Enable"}</button></div>`).join("")||"No products found."}window.price=async(id,v)=>{const value=Number(v);if(!Number.isFinite(value)||value<0)return alert("Enter a valid selling price.");const r=await supabase.from("products").update({selling_price:value,price_override:value,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);else load()};window.stock=async(id,v)=>{const value=Math.max(0,Math.floor(Number(v)));if(!Number.isFinite(value))return alert("Enter a valid inventory quantity.");const r=await supabase.from("products").update({inventory_qty:value,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);else load()};window.toggle=async(id,active)=>{const r=await supabase.from("products").update({active:!active,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);else load()};el("#search").oninput=render;el("#add").onclick=async()=>{const name=prompt("Product name");if(!name?.trim())return;const cost=Number(prompt("Supplier cost (₹)","0"));const price=Number(prompt("Selling price (₹)",String(Math.max(0,cost+100))));if(!Number.isFinite(cost)||!Number.isFinite(price)||cost<0||price<0)return alert("Invalid price.");const sku="TK-"+Date.now().toString(36).toUpperCase();const slug=name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36);const r=await supabase.from("products").insert({name:name.trim(),slug,supplier_cost:cost,auto_margin:Math.max(0,price-cost),selling_price:price,price_override:price,active:true,inventory_qty:0,sku,low_stock_threshold:5}).select("id").single();if(r.error)alert(r.error.message);else load()};load();</script><script>(function(){const b=document.getElementById("mobileMenuBtn"),o=document.getElementById("sidebarOverlay");if(!b||!o)return;function close(){document.body.classList.remove("admin-menu-open");b.setAttribute("aria-expanded","false")}b.addEventListener("click",()=>{const open=document.body.classList.toggle("admin-menu-open");b.setAttribute("aria-expanded",String(open))});o.addEventListener("click",close);document.querySelectorAll("aside nav a").forEach(a=>a.addEventListener("click",close))})();</script></body></html>
