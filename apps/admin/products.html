<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products — Owner Dashboard</title><link rel="stylesheet" href="./styles.css"><style>
.product-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}.product-toolbar input{flex:1;min-width:0}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.product-card{border:1px solid #e7e7e2;border-radius:15px;overflow:hidden;background:#fff;min-width:0}.product-image{height:190px;background:#f3f3f0;display:grid;place-items:center;position:relative}.product-image img{width:100%;height:100%;object-fit:contain}.image-empty{color:#999;font-size:13px}.image-actions{position:absolute;right:10px;bottom:10px;display:flex;gap:7px}.image-actions button,.image-actions .button-like,.product-card button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;display:inline-block}.image-actions label{cursor:pointer}.image-actions .danger{color:#b42318}.product-fields{padding:14px;display:grid;gap:10px}.product-fields label{display:grid;gap:5px;font-size:11px;color:#777;font-weight:700}.product-fields input{width:100%;min-width:0;border:1px solid #deded9;border-radius:8px;padding:9px 10px;background:#fff;color:#171717;font:inherit;font-size:13px}.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.product-card-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.product-card-head strong{font-size:13px;line-height:1.35;overflow-wrap:anywhere}.product-card-head small{color:#777;font-size:10px;white-space:nowrap}.product-actions{display:flex;gap:8px}.product-actions button{flex:1}.product-actions .save{background:#171717;color:#fff;border-color:#171717}.product-status{font-size:11px;color:#777}.product-status.active{color:#23834f}.file-input{display:none}.product-notice{font-size:12px;color:#777;min-height:16px}.product-notice.error{color:#b42318}.product-notice.success{color:#23834f}
@media(max-width:700px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product-image{height:140px}.product-fields{padding:10px;gap:8px}.product-card-head{display:block}.product-card-head small{display:block;margin-top:3px}.product-fields label{font-size:10px}.product-fields input{padding:8px 7px;font-size:12px}.field-pair{gap:6px}.product-actions{flex-direction:column}.product-actions button{width:100%}.image-actions{right:6px;bottom:6px;gap:4px}.image-actions button,.image-actions .button-like{padding:6px 7px;font-size:10px}.product-toolbar{gap:8px}.product-toolbar button{white-space:nowrap;padding:10px;font-size:12px}}
@media(max-width:380px){.product-grid{grid-template-columns:1fr}.product-image{height:180px}}
</style></head><body><button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open owner menu" aria-expanded="false">☰</button><div class="sidebar-overlay" id="sidebarOverlay"></div><script src="./sidebar.js"></script><main><header><div><p class="muted">CATALOG</p><h1>Products</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="panel"><div class="product-toolbar"><input id="search" placeholder="Search products…" aria-label="Search products"><button id="add" type="button">+ Add product</button></div><div id="products">Loading products…</div></section></main>
<script type="module">
import {supabase} from "../supabase.js";import {requireOwner} from "./auth.js";await requireOwner();
const el=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let products=[];
async function load(){el("#products").textContent="Loading products…";const r=await supabase.from("products").select("id,name,supplier_cost,auto_margin,selling_price,active,inventory_qty,sku,image_url,category_id").order("created_at",{ascending:false});if(r.error){el("#products").textContent="Could not load products: "+r.error.message;return}products=r.data||[];render()}
function render(){const q=el("#search").value.trim().toLowerCase();const rows=products.filter(p=>(p.name||"").toLowerCase().includes(q)||(p.sku||"").toLowerCase().includes(q));el("#products").innerHTML=rows.length?'<div class="product-grid">'+rows.map(p=>'<article class="product-card" data-id="'+esc(p.id)+'"><div class="product-image">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">':'<span class="image-empty">No product image</span>')+'<div class="image-actions"><label><input class="file-input" type="file" accept="image/*" data-upload="'+esc(p.id)+'"><span class="button-like">Replace image</span></label><button type="button" class="danger" data-remove-image="'+esc(p.id)+'" '+(!p.image_url?'disabled':'')+'>Remove</button></div></div><div class="product-fields"><div class="product-card-head"><strong>'+esc(p.name||"Untitled product")+'</strong><small>SKU '+esc(p.sku||"—")+'</small></div><label>Product name<input data-field="name" value="'+esc(p.name||"")+'"></label><div class="field-pair"><label>Cost (₹)<input data-field="supplier_cost" type="number" min="0" step="0.01" value="'+Number(p.supplier_cost||0)+'"></label><label>Auto margin (₹)<input data-field="auto_margin" type="number" min="0" step="0.01" value="'+Number(p.auto_margin||0)+'"></label></div><div class="field-pair"><label>Selling price (₹)<input data-field="selling_price" type="number" min="0" step="0.01" value="'+Number(p.selling_price||0)+'"></label><label>Stock<input data-field="inventory_qty" type="number" min="0" step="1" value="'+Number(p.inventory_qty||0)+'"></label></div><label>SKU<input data-field="sku" value="'+esc(p.sku||"")+'"></label><div class="product-actions"><button type="button" class="save" data-save="'+esc(p.id)+'">Save changes</button><button type="button" data-toggle="'+esc(p.id)+'">'+(p.active?"Disable":"Enable")+'</button></div><div class="product-status '+(p.active?"active":"")+'">'+(p.active?"Active on storefront":"Inactive")+'</div><div class="product-notice" aria-live="polite"></div></div></article>').join("")+'</div>':'<p>No products found.</p>'}
function notice(card,msg,type=""){const n=card.querySelector(".product-notice");n.textContent=msg;n.className="product-notice "+type}
el("#products").addEventListener("click",async ev=>{const save=ev.target.closest("[data-save]"),toggle=ev.target.closest("[data-toggle]"),remove=ev.target.closest("[data-remove-image]");if(save){const id=save.dataset.save,card=save.closest(".product-card"),v=k=>card.querySelector('[data-field="'+k+'"]').value;const name=v("name").trim(),cost=Number(v("supplier_cost")),margin=Number(v("auto_margin")),price=Number(v("selling_price")),stock=Number(v("inventory_qty")),sku=v("sku").trim();if(!name||![cost,margin,price,stock].every(Number.isFinite)||cost<0||margin<0||price<0||stock<0||!Number.isInteger(stock)){notice(card,"Check name, prices and stock values.","error");return}save.disabled=true;const r=await supabase.from("products").update({name,supplier_cost:cost,auto_margin:margin,selling_price:price,price_override:price,inventory_qty:stock,sku,updated_at:new Date().toISOString()}).eq("id",id);save.disabled=false;if(r.error)notice(card,r.error.message,"error");else{notice(card,"Changes saved.","success");const p=products.find(x=>x.id===id);Object.assign(p,{name,supplier_cost:cost,auto_margin:margin,selling_price:price,inventory_qty:stock,sku});card.querySelector(".product-card-head strong").textContent=name;card.querySelector(".product-card-head small").textContent="SKU "+(sku||"—")}}if(toggle){const id=toggle.dataset.toggle,p=products.find(x=>x.id===id);const r=await supabase.from("products").update({active:!p.active,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)notice(toggle.closest(".product-card"),r.error.message,"error");else{p.active=!p.active;render()}}if(remove){const id=remove.dataset.removeImage,card=remove.closest(".product-card");if(!confirm("Remove this product image?"))return;const r=await supabase.from("products").update({image_url:null,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)notice(card,r.error.message,"error");else{products.find(x=>x.id===id).image_url=null;render()}}});
el("#products").addEventListener("change",async ev=>{const input=ev.target.closest("input[data-upload]");if(!input||!input.files?.[0])return;const file=input.files[0],id=input.dataset.upload,card=input.closest(".product-card");if(!file.type.startsWith("image/")){notice(card,"Choose an image file.","error");return}if(file.size>5*1024*1024){notice(card,"Image must be 5 MB or smaller.","error");return}const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",path=id+"/"+Date.now()+"."+ext;notice(card,"Uploading image…");const up=await supabase.storage.from("product-images").upload(path,file,{upsert:true,contentType:file.type});if(up.error){notice(card,"Upload failed: "+up.error.message+" (the product-images storage bucket must exist and be public).","error");return}const url=supabase.storage.from("product-images").getPublicUrl(path).data.publicUrl;const saved=await supabase.from("products").update({image_url:url,updated_at:new Date().toISOString()}).eq("id",id);if(saved.error){notice(card,"Image uploaded, but product update failed: "+saved.error.message,"error");return}products.find(x=>x.id===id).image_url=url;render()});
el("#search").addEventListener("input",render);
el("#add").addEventListener("click",async()=>{const name=prompt("Product name");if(!name?.trim())return;const cost=Number(prompt("Supplier cost (₹)","0"));const price=Number(prompt("Selling price (₹)",String(Math.max(0,cost+100))));if(!Number.isFinite(cost)||!Number.isFinite(price)||cost<0||price<0)return alert("Enter valid prices.");const sku="TK-"+Date.now().toString(36).toUpperCase(),slug=name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36);const r=await supabase.from("products").insert({name:name.trim(),slug,supplier_cost:cost,auto_margin:Math.max(0,price-cost),selling_price:price,price_override:price,active:true,inventory_qty:0,sku,low_stock_threshold:5}).select("id").single();if(r.error)alert(r.error.message);else load()});load();
</script></body></html>
