<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DROP — Products</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><div><p class="muted">CATALOG</p><h1>Products</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="panel"><div class="toolbar"><input id="search" placeholder="Search products…"><button id="add">+ Add product</button></div><div id="products"></div></section></main><script type="module">import {supabase} from "../storefront/supabase.js";let products=[];const el=s=>document.querySelector(s);async function load(){const r=await supabase.from("products").select("id,name,supplier_cost,auto_margin,selling_price,active,category:categories(name)").order("created_at",{ascending:false});if(r.error){el("#products").textContent=r.error.message;return}products=r.data||[];render()}function render(){const q=el("#search").value.toLowerCase();el("#products").innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<div class="row"><div><b>${p.name}</b><small>${p.category?.name||"Uncategorized"} · Cost ₹${p.supplier_cost} · Auto margin ₹${p.auto_margin}</small></div><input value="${p.selling_price}" onchange="window.price('${p.id}',this.value)"><span>${p.active?"Active":"Inactive"}</span><button onclick="window.toggle('${p.id}',${p.active})">${p.active?"Disable":"Enable"}</button></div>`).join("")}window.price=async(id,v)=>{const r=await supabase.from("products").update({selling_price:Number(v),price_override:Number(v),updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);else load()};window.toggle=async(id,active)=>{const r=await supabase.from("products").update({active:!active,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);else load()};el("#search").oninput=render;load();</script></body></html>
