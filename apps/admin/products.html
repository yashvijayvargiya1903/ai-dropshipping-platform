<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DROP — Products</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><div><p class="muted">CATALOG</p><h1>Products</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="panel"><div class="toolbar"><input id="search" placeholder="Search products…"><button onclick="addProduct()">+ Add product</button></div><div id="products"></div></section></main><script>const key="drop-products";let products=JSON.parse(localStorage.getItem(key)||"null")||[{id:1,name:"Foldable Space Saver Bag",cost:210,price:310,category:"Home",active:true},{id:2,name:"Mini Portable Speaker",cost:280,price:380,category:"Gadgets",active:true}];function save(){localStorage.setItem(key,JSON.stringify(products))}function render(){const q=document.querySelector("#search").value.toLowerCase();document.querySelector("#products").innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)).map((p,i)=>`<div class="row"><div><b>${p.name}</b><small>${p.category} · Cost ₹${p.cost}</small></div><input value="${p.price}" onchange="price(${i},this.value)"><span>${p.active?"Active":"Inactive"}</span><button onclick="toggle(${i})">${p.active?"Disable":"Enable"}</button></div>`).join("")||"<p>No products found.</p>"}function price(i,v){products[i].price=Number(v);save();render()}function toggle(i){products[i].active=!products[i].active;save();render()}function addProduct(){const name=prompt("Product name");if(!name)return;const cost=Number(prompt("Supplier cost ₹","100"));const price=Number(prompt("Selling price ₹",String(cost+100)));products.push({id:Date.now(),name,cost,price,category:"Uncategorized",active:true});save();render()}document.querySelector("#search").oninput=render;render();</script></body></html>
