<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Products — Owner Dashboard</title><link rel="stylesheet" href="./styles.css">
<style>
.product-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}.product-toolbar input{flex:1;min-width:0}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;align-items:start}
.product-card{border:1px solid #e7e7e2;border-radius:14px;overflow:hidden;background:#fff;min-width:0;display:flex;flex-direction:column}
.product-summary{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;min-width:0;height:100%}
.product-thumb{width:100%;aspect-ratio:1/1;flex:none;border-radius:0;background:#f4f4f1;display:grid;place-items:center;overflow:hidden;color:#999;font-size:11px;text-align:center}
.product-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.product-summary-info{padding:10px 12px 8px;min-width:0;flex:1}
.product-summary-info strong{display:block;font-size:13px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.product-summary-info small{display:none}
.edit-toggle{margin:0 12px 12px;border:1px solid #d8d8d3;background:#fff;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.product-editor{border:1px solid #e5e5e0;border-radius:16px;padding:18px;display:grid;gap:12px;background:#fff;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:86vh;overflow:auto;z-index:1001;box-shadow:0 0 0 100vmax rgba(0,0,0,.52),0 18px 60px rgba(0,0,0,.25)}
.editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
.editor-head strong{font-size:16px;color:#171717}
.editor-close{width:32px;height:32px;border:0;border-radius:9px;background:#f1f1ee;color:#333;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;flex:none}
.product-editor[hidden]{display:none}
.product-editor label{display:grid;gap:5px;font-size:11px;color:#777;font-weight:700;min-width:0}
.product-editor input{width:100%;min-width:0;border:1px solid #deded9;border-radius:8px;padding:9px 10px;background:#fff;color:#171717;font:inherit;font-size:13px}
.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.image-edit{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.image-edit button,.image-edit .button-like,.product-actions button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;display:inline-block}
.image-edit label{display:inline-block}.image-edit .button-like{color:#171717;font-weight:600}.image-edit .danger{color:#b42318}.file-input{display:none}
.product-actions{display:flex;gap:8px}.product-actions button{flex:1}.product-actions .save{background:#171717;color:#fff;border-color:#171717}
.product-status,.product-notice{font-size:11px;color:#777;min-height:15px}.product-status.active,.product-notice.success{color:#23834f}.product-notice.error{color:#b42318}
@media(max-width:700px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product-summary-info{padding:9px 10px 7px}.product-summary-info strong{font-size:12px;min-height:33px}.edit-toggle{margin:0 10px 10px;padding:8px;font-size:12px}.product-editor{padding:14px;gap:9px;width:calc(100vw - 24px);max-height:88vh}.product-editor input{padding:8px 7px;font-size:12px}.field-pair{gap:6px}.product-actions{flex-direction:column}.product-actions button{width:100%}.product-toolbar{gap:8px}.product-toolbar button{white-space:nowrap;padding:10px;font-size:12px}}
@media(max-width:380px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-thumb{aspect-ratio:1/1}.product-summary-info{padding:8px}.edit-toggle{margin:0 8px 8px}}
</style></head>
<body>
<button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open owner menu" aria-expanded="false">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div><script src="./sidebar.js"></script>
<main><header><div><p class="muted">CATALOG</p><h1>Products</h1></div><a class="back" href="./index.html">← Dashboard</a></header>
<section class="panel"><div class="product-toolbar"><input id="search" placeholder="Search products…" aria-label="Search products"><button id="add" type="button">+ Add product</button></div><div id="products">Loading products…</div></section></main>
<script type="module">
import {supabase} from "../supabase.js";
import {requireOwner} from "./auth.js";
await requireOwner();
const el=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let products=[];
async function load(){el("#products").textContent="Loading products…";const r=await supabase.from("products").select("id,name,supplier_cost,auto_margin,selling_price,active,inventory_qty,sku,image_url,category_id").order("created_at",{ascending:false});if(r.error){el("#products").textContent="Could not load products: "+r.error.message;return}products=r.data||[];render()}
function render(){
 const q=el("#search").value.trim().toLowerCase();
 const rows=products.filter(p=>(p.name||"").toLowerCase().includes(q)||(p.sku||"").toLowerCase().includes(q));
 el("#products").innerHTML=rows.length?'<div class="product-grid">'+rows.map(p=>'<article class="product-card" data-id="'+esc(p.id)+'"><div class="product-summary"><div class="product-thumb">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">':'No image')+'</div><div class="product-summary-info"><strong>'+esc(p.name||"Untitled product")+'</strong><small>SKU: '+esc(p.sku||"—")+'</small></div><button type="button" class="edit-toggle" aria-expanded="false" data-edit="'+esc(p.id)+'">Edit</button></div><div class="product-editor" data-editor="'+esc(p.id)+'" hidden><div class="editor-head"><strong>Edit product</strong><button type="button" class="editor-close" data-close aria-label="Close edit window">×</button></div><label>Product name<input data-field="name" value="'+esc(p.name||"")+'"></label><div class="field-pair"><label>Cost (₹)<input data-field="supplier_cost" type="number" min="0" step="0.01" value="'+Number(p.supplier_cost||0)+'"></label><label>Auto margin (₹)<input data-field="auto_margin" type="number" min="0" step="0.01" value="'+Number(p.auto_margin||0)+'"></label></div><div class="field-pair"><label>Selling price (₹)<input data-field="selling_price" type="number" min="0" step="0.01" value="'+Number(p.selling_price||0)+'"></label><label>Stock<input data-field="inventory_qty" type="number" min="0" step="1" value="'+Number(p.inventory_qty||0)+'"></label></div><label>SKU<input data-field="sku" value="'+esc(p.sku||"")+'"></label><div class="image-edit"><label><input class="file-input" type="file" accept="image/*" data-upload="'+esc(p.id)+'"><span class="button-like">Replace image</span></label><button type="button" class="danger" data-remove-image="'+esc(p.id)+'" '+(!p.image_url?'disabled':'')+'>Remove image</button></div><div class="product-actions"><button type="button" class="save" data-save="'+esc(p.id)+'">Save changes</button><button type="button" data-toggle="'+esc(p.id)+'">'+(p.active?"Disable product":"Enable product")+'</button></div><div class="product-status '+(p.active?"active":"")+'">'+(p.active?"Active on storefront":"Inactive")+'</div><div class="product-notice" aria-live="polite"></div></div></article>').join("")+'</div>':'<p>No products found.</p>';
}
function notice(card,msg,type=""){const n=card.querySelector(".product-notice");n.textContent=msg;n.className="product-notice "+type}
el("#products").addEventListener("click",async ev=>{
 const edit=ev.target.closest("[data-edit]"),close=ev.target.closest("[data-close]"),save=ev.target.closest("[data-save]"),toggle=ev.target.closest("[data-toggle]"),remove=ev.target.closest("[data-remove-image]");
 if(edit){const card=edit.closest(".product-card"),editor=card.querySelector("[data-editor]");document.querySelectorAll(".product-editor").forEach(x=>{x.hidden=true});document.querySelectorAll("[data-edit]").forEach(x=>x.setAttribute("aria-expanded","false"));editor.hidden=false;edit.setAttribute("aria-expanded","true");}
 if(close){const card=close.closest(".product-card");card.querySelector(".product-editor").hidden=true;card.querySelector("[data-edit]").setAttribute("aria-expanded","false");}
 if(save){const id=save.dataset.save,card=save.closest(".product-card"),v=k=>card.querySelector('[data-field="'+k+'"]').value;const name=v("name").trim(),cost=Number(v("supplier_cost")),margin=Number(v("auto_margin")),price=Number(v("selling_price")),stock=Number(v("inventory_qty")),sku=v("sku").trim();if(!name||![cost,margin,price,stock].every(Number.isFinite)||cost<0||margin<0||price<0||stock<0||!Number.isInteger(stock)){notice(card,"Check name, prices and stock values.","error");return}save.disabled=true;const r=await supabase.from("products").update({name,supplier_cost:cost,auto_margin:margin,selling_price:price,price_override:price,inventory_qty:stock,sku,updated_at:new Date().toISOString()}).eq("id",id);save.disabled=false;if(r.error)notice(card,r.error.message,"error");else{notice(card,"Changes saved.","success");const p=products.find(x=>x.id===id);Object.assign(p,{name,supplier_cost:cost,auto_margin:margin,selling_price:price,inventory_qty:stock,sku});card.querySelector(".product-summary-info strong").textContent=name;card.querySelector(".product-summary-info small").textContent="SKU: "+(sku||"—");}}
 if(toggle){const id=toggle.dataset.toggle,p=products.find(x=>x.id===id),card=toggle.closest(".product-card");const r=await supabase.from("products").update({active:!p.active,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)notice(card,r.error.message,"error");else{p.active=!p.active;notice(card,p.active?"Product enabled.":"Product disabled.","success");toggle.textContent=p.active?"Disable product":"Enable product";card.querySelector(".product-status").textContent=p.active?"Active on storefront":"Inactive";card.querySelector(".product-status").className="product-status "+(p.active?"active":"");}}
 if(remove){const id=remove.dataset.removeImage,card=remove.closest(".product-card");if(!confirm("Remove this product image?"))return;const r=await supabase.from("products").update({image_url:null,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)notice(card,r.error.message,"error");else{products.find(x=>x.id===id).image_url=null;render();}}
});
el("#products").addEventListener("change",async ev=>{const input=ev.target.closest("input[data-upload]");if(!input||!input.files?.[0])return;const file=input.files[0],id=input.dataset.upload,card=input.closest(".product-card");if(!file.type.startsWith("image/")){notice(card,"Choose an image file.","error");return}if(file.size>5*1024*1024){notice(card,"Image must be 5 MB or smaller.","error");return}const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",path=id+"/"+Date.now()+"."+ext;notice(card,"Uploading image…");const up=await supabase.storage.from("product-images").upload(path,file,{upsert:true,contentType:file.type});if(up.error){notice(card,"Upload failed: "+up.error.message+" (check the product-images storage bucket and permissions).","error");return}const url=supabase.storage.from("product-images").getPublicUrl(path).data.publicUrl;const saved=await supabase.from("products").update({image_url:url,updated_at:new Date().toISOString()}).eq("id",id);if(saved.error){notice(card,"Image uploaded, but product update failed: "+saved.error.message,"error");return}products.find(x=>x.id===id).image_url=url;render();const target=document.querySelector('.product-card[data-id="'+CSS.escape(id)+'"]');if(target){target.querySelector(".product-editor").hidden=false;target.querySelector("[data-edit]").textContent="Close";target.querySelector("[data-edit]").setAttribute("aria-expanded","true");notice(target,"Image updated.","success");}});
el("#search").addEventListener("input",render);
el("#add").addEventListener("click",async()=>{const name=prompt("Product name");if(!name?.trim())return;const cost=Number(prompt("Supplier cost (₹)","0"));const price=Number(prompt("Selling price (₹)",String(Math.max(0,cost+100))));if(!Number.isFinite(cost)||!Number.isFinite(price)||cost<0||price<0)return alert("Enter valid prices.");const sku="TK-"+Date.now().toString(36).toUpperCase(),slug=name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36);const r=await supabase.from("products").insert({name:name.trim(),slug,supplier_cost:cost,auto_margin:Math.max(0,price-cost),selling_price:price,price_override:price,active:true,inventory_qty:0,sku,low_stock_threshold:5}).select("id").single();if(r.error)alert(r.error.message);else load()});
load();
</script></body></html>
