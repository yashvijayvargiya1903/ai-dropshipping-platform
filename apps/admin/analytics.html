<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trendskartco — Analytics</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><div><p class="muted">BUSINESS</p><h1>Analytics</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="cards"><div><span>Total orders</span><strong id="orders">—</strong></div><div><span>Delivered</span><strong id="delivered">—</strong></div><div><span>Returns</span><strong id="returns">—</strong></div><div><span>Revenue</span><strong id="revenue">—</strong></div></section><section class="panel"><h2>Operating picture</h2><p>Metrics are read from live Supabase order and return data.</p></section></main><script type="module">import {supabase} from "../storefront/supabase.js";import {requireOwner} from "./auth.js";if(!(await requireOwner()))throw new Error("Owner access required");const [o,r]=await Promise.all([supabase.from("orders").select("status,total"),supabase.from("return_requests").select("id,status")]);if(!o.error){const d=o.data||[];document.querySelector("#orders").textContent=d.length;document.querySelector("#delivered").textContent=d.filter(x=>x.status==="DELIVERED").length;document.querySelector("#returns").textContent=(r.data||[]).length;document.querySelector("#revenue").textContent="₹"+d.reduce((s,x)=>s+Number(x.total||0),0).toLocaleString("en-IN")}else document.querySelector("#orders").textContent=o.error.message;</script></body></html>
