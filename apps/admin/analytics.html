<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DROP — Analytics</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><div><p class="muted">BUSINESS</p><h1>Analytics</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="cards"><div><span>Total orders</span><strong id="orders">—</strong></div><div><span>Delivered</span><strong id="delivered">—</strong></div><div><span>Returns</span><strong id="returns">—</strong></div><div><span>Revenue</span><strong id="revenue">—</strong></div></section><section class="panel"><h2>Operating picture</h2><p>Metrics are read from the live Supabase order data. Demo orders are included until they are removed.</p></section></main><script type="module">import {supabase} from "../storefront/supabase.js";const r=await supabase.from("orders").select("status,total_amount");if(!r.error){const d=r.data||[];document.querySelector("#orders").textContent=d.length;document.querySelector("#delivered").textContent=d.filter(x=>x.status==="DELIVERED").length;document.querySelector("#returns").textContent=d.filter(x=>String(x.status).includes("RETURN")).length;document.querySelector("#revenue").textContent="₹"+d.reduce((s,x)=>s+Number(x.total_amount||0),0).toLocaleString("en-IN")}</script></body></html>
