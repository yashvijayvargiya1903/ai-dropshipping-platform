<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trendskartco — Action Center</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><div><p class="muted">OPERATIONS</p><h1>Action Center</h1></div><a class="back" href="./index.html">← Dashboard</a></header><section class="panel"><div id="actions">Loading…</div></section></main><script type="module">import {supabase} from "../storefront/supabase.js";const e=document.querySelector("#actions");async function load(){const r=await supabase.from("action_items").select("id,type,severity,status,title,description,due_at,created_at,order_id").order("created_at",{ascending:false});if(r.error){e.textContent=r.error.message;return}e.innerHTML=(r.data||[]).map(x=>{const open=String(x.status).toLowerCase()==="open";return `<div class="row"><div><b>${x.title||x.type}</b><small>${x.description||""}</small></div><strong>${x.severity||"NORMAL"}</strong><span>${x.status}</span><button onclick="resolveAction('${x.id}')" ${open?"":"disabled"}>${open?"Resolve":"Resolved"}</button></div>`}).join("")||"No action items."}window.resolveAction=async id=>{const r=await supabase.from("action_items").update({status:"resolved",resolved_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);else load()};load();</script></body></html>
